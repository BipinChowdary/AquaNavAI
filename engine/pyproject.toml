[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aquanavai-engine"
version = "0.2.0"
description = "Reproducible forecast-aware coastal route-planning research engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "codecarbon>=3.2,<4",
  "h5netcdf>=1.6,<2",
  "h5py>=3.13,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pyproj>=3.7,<4",
  "pyyaml>=6.0,<7",
  "rasterio>=1.4,<2",
  "scipy>=1.15,<2",
  "shapely>=2.1,<3",
  "typer>=0.16,<1",
  "xarray>=2025.1,<2027",
]

[project.scripts]
aquanav = "aquanavai.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.16.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aquanavai"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aquanavai"]

[[tool.mypy.overrides]]
module = ["pandas", "yaml", "scipy.*", "rasterio", "rasterio.*", "shapely", "shapely.*", "jsonschema"]
ignore_missing_imports = true
